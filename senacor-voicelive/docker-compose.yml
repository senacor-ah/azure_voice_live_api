# ============================================================================
# Senacor VoiceLive - Docker Compose
# ============================================================================
# For local testing of the containerized app before deploying to Azure.
#
# Usage:
#   docker compose up --build
#
# The app will be available at http://localhost:8080
# WebSocket endpoint:       ws://localhost:8080/ws/voice

services:
  voicelive:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Persist recordings outside container (optional)
      - ./recordings:/app/recordings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
